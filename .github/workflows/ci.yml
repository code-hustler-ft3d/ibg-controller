name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual run on any ref. Only tag refs publish: the release steps below
  # are conditioned on refs/tags/v*, so a run on a branch builds and tests.
  workflow_dispatch:

# Read-only by default. Only build-and-test writes, to create the GitHub
# release on a tag; it never builds the image. The jobs that do build it,
# and so run IBKR's installer, are on a read-only token.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release create, on tags only

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host tools used by the Makefile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make unzip

      - name: make clean
        run: make clean

      - name: make (build agent jar + stage controller)
        run: make

      - name: make test (py_compile + agent manifest check + unit tests)
        run: make test

      - name: make release (build tarball)
        # On tag pushes GITHUB_REF_NAME is e.g. "v0.5.13" → "0.5.13".
        # On main pushes it's "main". On pull_request events it's
        # "<num>/merge" — the slash leaks into the tarball path and
        # breaks the glob in the next step, so squash any "/" to "-".
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION=${VERSION//\//-}
          make release VERSION="$VERSION"

      - name: Verify tarball layout
        run: |
          tar -tzf dist/ibg-controller-*.tar.gz

      - name: Verify install.sh extracts cleanly
        run: |
          mkdir -p /tmp/install-test /tmp/install-dest
          cd /tmp/install-test
          tar -xzf $GITHUB_WORKSPACE/dist/ibg-controller-*.tar.gz
          cd ibg-controller-*
          DESTDIR=/tmp/install-dest ./install.sh
          test -f /tmp/install-dest/gateway-input-agent.jar
          test -f /tmp/install-dest/scripts/gateway_controller.py

      - name: Upload release tarball (artifact)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-tarball
          path: dist/ibg-controller-*.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/ibg-controller-*.tar.gz \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/code-hustler-ft3d/ibg-controller/blob/main/CHANGELOG.md) for details." \
            --repo "$GITHUB_REPOSITORY"

  smoke-test-image:
    runs-on: ubuntu-24.04
    needs: build-and-test
    # Smoke-test that gateway_controller.py imports cleanly on a
    # vanilla host with only stdlib python3 — no gi/Atspi/ATK
    # dependencies. The controller used to require the full pyatspi2
    # stack (retired by v0.5.12 / v0.5.13 / v0.5.14). If anyone
    # accidentally re-introduces an `import gi` at module load, this
    # job fails because we don't install python3-gi here.
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build deps on the runner
        # A stock ubuntu-24.04 runner (the shipped image is on Ubuntu
        # 26.04 since Gateway 10.50.1g; the matrix job below runs the
        # same import inside it). We deliberately do NOT install python3-gi /
        # gir1.2-atspi-2.0 / at-spi2-core: the import smoke test below
        # must succeed without them (v0.5.14 dropped the gi imports;
        # this job is the regression guard).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            make unzip python3

      - name: make
        run: make

      - name: Real-gi module-load smoke test
        env:
          TWS_USERID: x
          TWS_PASSWORD: x
          TRADING_MODE: paper
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import gateway_controller as gc
          print("module loaded, version check OK")
          print(f"  version={gc.__version__}")
          print(f"  TRADING_MODE={gc.TRADING_MODE}")
          print(f"  APP_NAME_CANDIDATES={gc.APP_NAME_CANDIDATES}")
          print(f"  SAFE_DISMISS_BUTTONS has {len(gc.SAFE_DISMISS_BUTTONS)} entries")
          PY

  gateway-version-matrix:
    # Named, or the check's name would include the matrix entry's checksums.
    name: gateway-version-matrix (${{ matrix.gateway }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: build-and-test
    # Build the shipped Dockerfile and check the image, so a change in an
    # installer's layout (JRE path), an Ubuntu package or a checksum shows
    # up here before a release.
    #
    #   - `pinned`, on amd64 and arm64: the Dockerfile's own pins with no
    #     build args, the exact files a release builds. Each architecture
    #     has its own installer and checksum, so each is built natively. A
    #     Gateway bump branch only edits the Dockerfile, so these entries
    #     are what test it.
    #   - One version from IBKR's `latest` channel: "does the image still
    #     build and boot on the newer Gateway line" (issue #24). A build and
    #     smoke check only. Login, 2FA and the dialog handlers are verified
    #     against the pinned stable line; nothing here claims they are
    #     verified on `latest`. Its installers are in the `build-inputs`
    #     release (gateway-bump.yml, run by hand with channel `latest`).
    #
    # Versions and checksums, never "whatever IBKR serves today", so a PR
    # run stays deterministic and IBKR moving a channel can't turn an
    # unrelated PR red.
    strategy:
      fail-fast: false
      matrix:
        include:
          - gateway: pinned
            runner: ubuntu-24.04
          - gateway: pinned
            runner: ubuntu-24.04-arm
          - gateway: 10.53.1a
            runner: ubuntu-24.04
            sha256_x64: eba6b0f8fe9164586343b7637065a95a7480a4be72792e608ea0252cf594229b
            sha256_arm: 10e3cb68d8597ae761b171d6f8c97bfeb9e4a1fc31130fa55ba5dcb0ae646e2d
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host tools used by the Makefile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make unzip

      - name: make (populate dist/ for COPY)
        run: make

      - name: Build image with Gateway ${{ matrix.gateway }}
        env:
          MATRIX_GATEWAY: ${{ matrix.gateway }}
          MATRIX_SHA256_X64: ${{ matrix.sha256_x64 }}
          MATRIX_SHA256_ARM: ${{ matrix.sha256_arm }}
        run: |
          if [ "$MATRIX_GATEWAY" = pinned ]; then
            docker build -t ibg-controller:matrix-test .
            exit 0
          fi
          docker build \
            --build-arg IB_GATEWAY_VERSION="$MATRIX_GATEWAY" \
            --build-arg IB_GATEWAY_SHA256_X64="$MATRIX_SHA256_X64" \
            --build-arg IB_GATEWAY_SHA256_ARM="$MATRIX_SHA256_ARM" \
            -t ibg-controller:matrix-test .

      - name: The image is what the start-up scripts expect
        # The names run.sh, IBC's mode and the controller read, the files
        # they open, and the tools they call. The image used to inherit
        # these from another image; now this Dockerfile provides them.
        env:
          MATRIX_GATEWAY: ${{ matrix.gateway }}
        run: |
          docker run --rm -e MATRIX_GATEWAY --entrypoint bash ibg-controller:matrix-test -c '
            set -e
            fail() { echo "REGRESSION: $*"; exit 1; }
            [ "$(id -u):$(id -g)" = 1000:1000 ] || fail "runs as $(id -u):$(id -g), not 1000:1000"
            [ "$(id -un)" = ibgateway ] || fail "user 1000 is $(id -un), not ibgateway"
            [ "$HOME" = /home/ibgateway ] && [ "$PWD" = /home/ibgateway ] || fail "HOME=$HOME PWD=$PWD"
            [ "$MATRIX_GATEWAY" = pinned ] || [ "$IB_GATEWAY_VERSION" = "$MATRIX_GATEWAY" ] \
              || fail "IB_GATEWAY_VERSION=$IB_GATEWAY_VERSION, built for $MATRIX_GATEWAY"
            [ "$TWS_MAJOR_VRSN" = "$IB_GATEWAY_VERSION" ] || fail "TWS_MAJOR_VRSN=$TWS_MAJOR_VRSN"
            [ "$TWS_PATH" = /home/ibgateway/Jts ] || fail "TWS_PATH=$TWS_PATH"
            [ "$TWS_INI" = jts.ini ] && [ "$TWS_INI_TMPL" = jts.ini.tmpl ] || fail "TWS_INI=$TWS_INI TWS_INI_TMPL=$TWS_INI_TMPL"
            [ "$IBC_PATH" = /home/ibgateway/ibc ] || fail "IBC_PATH=$IBC_PATH"
            [ "$IBC_INI" = /home/ibgateway/ibc/config.ini ] || fail "IBC_INI=$IBC_INI"
            [ "$IBC_INI_TMPL" = /home/ibgateway/ibc/config.ini.tmpl ] || fail "IBC_INI_TMPL=$IBC_INI_TMPL"
            [ "$SCRIPT_PATH" = /home/ibgateway/scripts ] || fail "SCRIPT_PATH=$SCRIPT_PATH"
            [ "$GATEWAY_OR_TWS" = gateway ] || fail "GATEWAY_OR_TWS=$GATEWAY_OR_TWS"
            gw="$TWS_PATH/ibgateway/$IB_GATEWAY_VERSION"
            for f in "$gw/ibgateway" "$gw/ibgateway.vmoptions" "$gw/jars" \
                     "$TWS_PATH/$TWS_INI_TMPL" "$IBC_INI_TMPL" "$IBC_PATH/IBC.jar" \
                     "$IBC_PATH/scripts/ibcstart.sh"; do
              [ -e "$f" ] || fail "$f is missing"
            done
            for f in run.sh common.sh run_socat.sh run_ssh.sh healthcheck.sh gateway_controller.py; do
              [ -x "$SCRIPT_PATH/$f" ] || fail "$SCRIPT_PATH/$f is missing or not executable"
            done
            [ -x "$IBC_PATH/scripts/ibcstart.sh" ] || fail "ibcstart.sh is not executable"
            # Everything under the home directory belongs to the user: Gateway
            # writes its settings and logs there.
            other=$(find "$HOME" ! -user 1000 -print -quit)
            [ -z "$other" ] || fail "$other is not owned by 1000"
            grep -q -- "-Xmx768m" "$gw/ibgateway.vmoptions" \
              || fail "ibgateway.vmoptions has no -Xmx768m for JAVA_HEAP_SIZE to replace"
            for tool in envsubst socat Xvfb x11vnc sshpass ssh ssh-agent sudo telnet \
                        python3 matchbox-window-manager curl pgrep pkill; do
              command -v "$tool" >/dev/null || fail "$tool is not installed"
            done
            sudo -n true || fail "sudo needs a password"
            # The settings files render from the templates, as apply_settings does.
            TIME_ZONE=Etc/UTC envsubst <"$TWS_PATH/$TWS_INI_TMPL" | grep -q "^TimeZone=Etc/UTC$" \
              || fail "jts.ini.tmpl does not render TimeZone"
            # The config.ini that IBC ships has Windows line endings.
            TWS_USERID=someone envsubst <"$IBC_INI_TMPL" | tr -d "\r" | grep -q "^IbLoginId=someone$" \
              || fail "config.ini.tmpl does not render IbLoginId"
            # Gateway starts on its bundled JRE.
            java=$(find "$gw" /usr/local/i4j_jres -path "*/bin/java" -type f 2>/dev/null | head -1)
            [ -n "$java" ] || fail "no Gateway JRE found"
            "$java" -version 2>&1 | head -1
            echo "OK image layout, user, tools and templates"
          '

      - name: Container-level module-load smoke test
        # Verify gateway_controller.py imports cleanly inside the built
        # image. v0.5.14 dropped the gi/Atspi import, so this should
        # succeed with stdlib-only python3. Catches drift in the image
        # (missing libs, changed paths) at CI time rather than at
        # runtime on a user's host.
        env:
          TWS_USERID: x
          TWS_PASSWORD: x
          TRADING_MODE: paper
        run: |
          docker run --rm \
            -e TWS_USERID -e TWS_PASSWORD -e TRADING_MODE \
            --entrypoint python3 \
            ibg-controller:matrix-test \
            -c 'import sys; sys.path.insert(0, "/home/ibgateway/scripts"); import gateway_controller as gc; print(f"OK version={gc.__version__} TRADING_MODE={gc.TRADING_MODE}")'

      - name: run.sh process tests on the image's own shell
        # The runner has bash 5.2 and GNU coreutils. The image has its
        # own: on the Ubuntu 26.04 base, bash 5.3 and the Rust coreutils.
        # run.sh's wait_for_controllers depends on `wait -n -p`, so its
        # tests also run where it ships. A skipped test fails the step:
        # skipping is how these tests report a shell they can't use.
        run: |
          docker run --rm -v "$PWD":/repo:ro -w /repo \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint bash ibg-controller:matrix-test -c '
              set -o pipefail
              bash --version | head -1
              python3 -m unittest -v tests.test_run_sh 2>&1 | tee /tmp/run_sh_tests.log
              if grep -q "skipped" /tmp/run_sh_tests.log; then
                echo "REGRESSION: run.sh tests were skipped in the image"
                exit 1
              fi'

      - name: Verify AT-SPI bridge stays absent (regression guard)
        # v0.5.13 removed the JRE accessibility.properties write and
        # the libatk-wrapper.so copy into JAVA_HOME/lib (and the apt
        # install of libatk-wrapper-java*). v0.5.12 disabled the
        # bridge in the JVM after a thread-dump-confirmed deadlock —
        # see CHANGELOG.md v0.5.12.
        #
        # This step guards against three regressions:
        #   1. A future Dockerfile edit accidentally restoring the
        #      accessibility.properties write or the .so copy.
        #   2. A package on the Dockerfile's list starting to pull in
        #      libatk-wrapper-java (which would let
        #      AtkWrapper load if the Java flag override were ever
        #      removed).
        #   3. The JVM-args-level disable
        #      (-Djavax.accessibility.assistive_technologies=) being
        #      stripped from gateway_controller.py.
        run: |
          docker run --rm --entrypoint bash ibg-controller:matrix-test -c '
            set -e
            # Gateway 10.45.x keeps its JRE under /usr/local/i4j_jres;
            # 10.50.x keeps it under $TWS_PATH/ibgateway/<version>/jre.
            GW_JAVA=$(find /usr/local/i4j_jres "${TWS_PATH:-/home/ibgateway/Jts}" \
                        -path "*/bin/java" -type f 2>/dev/null | head -1)
            if [ -z "$GW_JAVA" ]; then
              GW_JAVA=$(find /usr/local -path "*/zulu*/bin/java" -type f 2>/dev/null | head -1)
            fi
            if [ -z "$GW_JAVA" ]; then
              echo "REGRESSION: no Gateway JRE found, so checks 1 and 2 below"
              echo "would test nothing. Find where this Gateway keeps its JRE"
              echo "and add that location to the search above."
              exit 1
            fi
            JAVA_HOME=$(dirname $(dirname "$GW_JAVA"))
            echo "JAVA_HOME=$JAVA_HOME"

            # 1. accessibility.properties must NOT have been written.
            if [ -f "$JAVA_HOME/conf/accessibility.properties" ]; then
              echo "REGRESSION: $JAVA_HOME/conf/accessibility.properties present —"
              echo "v0.5.13 dropped this write. If Gateway or a package now"
              echo "ships its own copy, audit it before relaxing this guard."
              cat "$JAVA_HOME/conf/accessibility.properties"
              exit 1
            fi
            echo "OK accessibility.properties absent from JRE conf dir"

            # 2. libatk-wrapper.so must NOT be in the JRE lib dir.
            if ls "$JAVA_HOME/lib/" 2>/dev/null | grep -q libatk-wrapper; then
              echo "REGRESSION: libatk-wrapper.so present in $JAVA_HOME/lib/ —"
              echo "v0.5.13 dropped the JNI copy step. If a package"
              echo "now ships it, the AT-SPI bridge could load on a JVM that"
              echo "does not have the assistive_technologies override."
              exit 1
            fi
            echo "OK libatk-wrapper.so absent from JRE lib dir"

            # 3. The JVM-args-level disable must still be in the controller.
            #    (Belt-and-suspenders against package-shipped JARs.)
            if ! grep -q -- "-Djavax.accessibility.assistive_technologies=" \
                 /home/ibgateway/scripts/gateway_controller.py; then
              echo "REGRESSION: gateway_controller.py no longer passes the"
              echo "assistive_technologies disable flag — see v0.5.12 CHANGELOG"
              echo "for the deadlock that motivated it."
              exit 1
            fi
            echo "OK assistive_technologies disable flag still in controller"

            # 4. Sanity: the things v0.5.13/v0.5.14 KEPT must still be present.
            test -f /home/ibgateway/gateway-input-agent.jar \
              && echo "OK input agent jar in place"
            test -f /home/ibgateway/scripts/gateway_controller.py \
              && echo "OK controller python in place"
            test -x /home/ibgateway/scripts/run.sh \
              && echo "OK run.sh executable in place"
            command -v matchbox-window-manager >/dev/null \
              && echo "OK matchbox-window-manager installed"

            # 5. v0.5.14: the gi/Atspi stack should not be installed
            #    by OUR Dockerfile. We log dpkg state informationally —
            #    another package may pull one in (we tolerate that, since
            #    nothing imports it anymore). The strict regression
            #    guard for "controller imports without gi" lives in the
            #    smoke-test-image job, which runs on a vanilla runner
            #    with no gi packages installed.
            for pkg in python3-gi gir1.2-atspi-2.0 at-spi2-core; do
              if dpkg -l "$pkg" 2>/dev/null | grep -q "^ii"; then
                echo "NOTE: $pkg installed (a dependency; the Dockerfile does not list it)"
              else
                echo "OK $pkg absent"
              fi
            done
          '
